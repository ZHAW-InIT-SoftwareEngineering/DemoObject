name: Demo Object - Deploy Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-stack-deploy
  cancel-in-progress: true

jobs:
  build_and_push_backend:
    name: Build and Push Backend Image
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: 'ghcr.io/${{ vars.GHCR_USERNAME }}/demoobject-backend'
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate GHCR credentials are present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "Missing required GitHub Secret: GHCR_PAT" >&2
            exit 1
          fi
          if [ -z "${GHCR_USERNAME}" ]; then
            echo "Missing required GitHub Variable: GHCR_USERNAME" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          provenance: false
          sbom: false

  build_and_push_frontend:
    name: Build and Push Frontend Image
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    env:
      FRONTEND_IMAGE: 'ghcr.io/${{ vars.GHCR_USERNAME }}/demoobject-frontend'
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate GHCR credentials are present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "Missing required GitHub Secret: GHCR_PAT" >&2
            exit 1
          fi
          if [ -z "${GHCR_USERNAME}" ]; then
            echo "Missing required GitHub Variable: GHCR_USERNAME" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          provenance: false
          sbom: false

  deploy_stack:
    name: Deploy Stack to VM
    runs-on: [self-hosted, Linux, X64]
    needs:
      - build_and_push_backend
      - build_and_push_frontend
    permissions:
      contents: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || './demoobject' }}
      BACKEND_IMAGE: 'ghcr.io/${{ vars.GHCR_USERNAME }}/demoobject-backend'
      FRONTEND_IMAGE: 'ghcr.io/${{ vars.GHCR_USERNAME }}/demoobject-frontend'
      FRONTEND_PORT: ${{ vars.APP_UPSTREAM_PORT }}
      DOMAIN: ${{ vars.DOMAIN }}
      DUCKDNS_SUBDOMAIN: ${{ vars.DUCKDNS_SUBDOMAIN }}
      LE_EMAIL: ${{ vars.LE_EMAIL }}
      APP_UPSTREAM_PORT: ${{ vars.APP_UPSTREAM_PORT }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
      MONGO_DATABASE: ${{ vars.MONGO_DATABASE }}
      SESSION_COLLECTION_NAME: ${{ vars.SESSION_COLLECTION_NAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
      DUCKDNS_TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            DEPLOY_PATH
            BACKEND_IMAGE
            MONGO_DATABASE
            SESSION_COLLECTION_NAME
            DOMAIN
            DUCKDNS_SUBDOMAIN
            LE_EMAIL
            APP_UPSTREAM_PORT
          )

          required_secrets=(
            GHCR_PAT
            MONGO_ROOT_USERNAME
            MONGO_ROOT_PASSWORD
            DUCKDNS_TOKEN
          )

          for key in "${required_vars[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Variable: ${key}" >&2
              exit 1
            fi
          done

          for key in "${required_secrets[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Secret: ${key}" >&2
              exit 1
            fi
          done

      - name: Validate Docker availability
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Log in to GHCR for deploy pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Prepare compose file on host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DEPLOY_PATH}"
          cp deploy/docker-compose.prod.yaml "${DEPLOY_PATH}/docker-compose.prod.yaml"

      - name: Configure host reverse proxy and certificate automation
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx certbot python3-certbot-nginx curl cron
          sudo systemctl enable --now nginx
          sudo systemctl enable --now cron

          sudo install -d -m 755 /opt/duckdns

          sudo tee /etc/default/duckdns >/dev/null <<EOF
          DUCKDNS_SUBDOMAIN=${DUCKDNS_SUBDOMAIN}
          DUCKDNS_TOKEN=${DUCKDNS_TOKEN}
          EOF
          sudo chmod 600 /etc/default/duckdns

          sudo tee /opt/duckdns/update.sh >/dev/null <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          source /etc/default/duckdns
          curl -fsS "https://www.duckdns.org/update?domains=${DUCKDNS_SUBDOMAIN}&token=${DUCKDNS_TOKEN}&ip="
          echo
          EOF
          sudo chmod 750 /opt/duckdns/update.sh

          sudo tee /etc/cron.d/duckdns >/dev/null <<'EOF'
          SHELL=/bin/bash
          PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          */5 * * * * root /opt/duckdns/update.sh >> /var/log/duckdns.log 2>&1
          EOF

          sudo /opt/duckdns/update.sh

          nginx_site="/etc/nginx/sites-available/demoobject"
          config_needs_update="false"

          if [ ! -f "${nginx_site}" ]; then
            config_needs_update="true"
          elif ! sudo grep -q "server_name ${DOMAIN};" "${nginx_site}"; then
            config_needs_update="true"
          elif ! sudo grep -q "proxy_pass http://127.0.0.1:${APP_UPSTREAM_PORT};" "${nginx_site}"; then
            config_needs_update="true"
          fi

          if [ "${config_needs_update}" = "true" ]; then
          sudo tee "${nginx_site}" >/dev/null <<EOF
          server {
              listen 80;
              listen [::]:80;
              server_name ${DOMAIN};

              location / {
                  proxy_pass http://127.0.0.1:${APP_UPSTREAM_PORT};
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
              }
          }
          EOF
          fi

          sudo ln -sfn /etc/nginx/sites-available/demoobject /etc/nginx/sites-enabled/demoobject
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t
          sudo systemctl reload nginx

          if [ ! -f "/etc/letsencrypt/live/${DOMAIN}/fullchain.pem" ] || [ ! -f "/etc/letsencrypt/live/${DOMAIN}/privkey.pem" ] || [ "${config_needs_update}" = "true" ]; then
            sudo certbot --nginx \
              -d "${DOMAIN}" \
              --agree-tos \
              --no-eff-email \
              -m "${LE_EMAIL}" \
              --non-interactive \
              --redirect
          fi

          sudo systemctl enable --now certbot.timer

      - name: Deploy mongo, api, and frontend services on self-hosted runner
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          export BACKEND_IMAGE
          export FRONTEND_IMAGE
          export FRONTEND_PORT
          export IMAGE_TAG
          export MONGO_ROOT_USERNAME
          export MONGO_ROOT_PASSWORD
          export MONGO_DATABASE
          export SESSION_COLLECTION_NAME

          docker compose -f "${DEPLOY_PATH}/docker-compose.prod.yaml" pull mongo api frontend
          docker compose -f "${DEPLOY_PATH}/docker-compose.prod.yaml" up -d --remove-orphans mongo api frontend

          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' demoobject-api 2>/dev/null || true)
            frontend_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' demoobject-frontend 2>/dev/null || true)
            if [ "$status" = "healthy" ] && [ "$frontend_status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          echo "API and/or frontend container did not become healthy in time." >&2
          docker ps >&2
          docker logs --tail 100 demoobject-api >&2 || true
          docker logs --tail 100 demoobject-frontend >&2 || true
          exit 1
