name: Demo Object - Deploy Stack

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-stack-deploy
  cancel-in-progress: true

jobs:
  build_and_push_backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure GHCR image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ghcr_namespace="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend_image=ghcr.io/${ghcr_namespace}/demoobject-backend" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.backend_image }}:${{ github.sha }}
          provenance: false
          sbom: false

  build_and_push_frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure GHCR image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ghcr_namespace="${GITHUB_REPOSITORY_OWNER,,}"
          echo "frontend_image=ghcr.io/${ghcr_namespace}/demoobject-frontend" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.frontend_image }}:${{ github.sha }}
          provenance: false
          sbom: false

  build_and_push_caddy:
    name: Build and Push Caddy Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure GHCR image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          ghcr_namespace="${GITHUB_REPOSITORY_OWNER,,}"
          echo "caddy_image=ghcr.io/${ghcr_namespace}/demoobject-caddy" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push caddy image
        uses: docker/build-push-action@v6
        with:
          context: ./caddy
          file: ./caddy/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.caddy_image }}:${{ github.sha }}
          provenance: false
          sbom: false


  deploy_stack:
    name: Deploy Stack to VM
    runs-on: ubuntu-latest
    needs:
      - build_and_push_backend
      - build_and_push_frontend
      - build_and_push_caddy
    permissions:
      contents: read
      packages: read
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || 'ubuntu' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || './demoobject' }}
      MONGO_DATABASE: ${{ vars.MONGO_DATABASE }}
      MONGO_COLLECTION_NAME: ${{ vars.MONGO_COLLECTION_NAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      GHCR_LOGIN_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GHCR image namespace
        shell: bash
        run: |
          set -euo pipefail
          ghcr_namespace="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "BACKEND_IMAGE=ghcr.io/${ghcr_namespace}/demoobject-backend"
            echo "FRONTEND_IMAGE=ghcr.io/${ghcr_namespace}/demoobject-frontend"
            echo "CADDY_IMAGE=ghcr.io/${ghcr_namespace}/demoobject-caddy"
          } >> "${GITHUB_ENV}"

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            VM_HOST
            VM_USER
            DEPLOY_PATH
            MONGO_DATABASE
            MONGO_COLLECTION_NAME
          )

          required_runtime_values=(
            BACKEND_IMAGE
            FRONTEND_IMAGE
            CADDY_IMAGE
            GHCR_LOGIN_USERNAME
            GHCR_TOKEN
          )

          required_secrets=(
            SSH_PRIVATE_KEY
            MONGO_ROOT_USERNAME
            MONGO_ROOT_PASSWORD
          )

          for key in "${required_vars[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Variable: ${key}" >&2
              exit 1
            fi
          done

          for key in "${required_runtime_values[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required workflow runtime value: ${key}" >&2
              exit 1
            fi
          done

          for key in "${required_secrets[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Secret: ${key}" >&2
              exit 1
            fi
          done

      - name: Configure SSH access to VM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/demoobject_deploy_key"
          chmod 600 "${HOME}/.ssh/demoobject_deploy_key"
          ssh-keyscan -H "${VM_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

      - name: Validate Docker availability on VM
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/demoobject_deploy_key" -o StrictHostKeyChecking=yes "${VM_USER}@${VM_HOST}" '
            set -euo pipefail
            docker version
            docker compose version
          '

      - name: Prepare compose file on VM
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/demoobject_deploy_key" -o StrictHostKeyChecking=yes "${VM_USER}@${VM_HOST}" "set -euo pipefail; mkdir -p $(printf '%q' "${DEPLOY_PATH}")"
          ssh -i "${HOME}/.ssh/demoobject_deploy_key" -o StrictHostKeyChecking=yes "${VM_USER}@${VM_HOST}" "set -euo pipefail; cat > $(printf '%q' "${DEPLOY_PATH}/docker-compose.prod.yaml")" < deploy/docker-compose.prod.yaml

      - name: Deploy mongo, api, frontend and caddy services on VM
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/demoobject_deploy_key" -o StrictHostKeyChecking=yes "${VM_USER}@${VM_HOST}" 'bash -s' <<EOF
          set -euo pipefail
          BACKEND_IMAGE=$(printf '%q' "${BACKEND_IMAGE}")
          FRONTEND_IMAGE=$(printf '%q' "${FRONTEND_IMAGE}")
          CADDY_IMAGE=$(printf '%q' "${CADDY_IMAGE}")
          IMAGE_TAG=$(printf '%q' "${IMAGE_TAG}")
          GHCR_LOGIN_USERNAME=$(printf '%q' "${GHCR_LOGIN_USERNAME}")
          GHCR_TOKEN=$(printf '%q' "${GHCR_TOKEN}")
          DEPLOY_PATH=$(printf '%q' "${DEPLOY_PATH}")
          MONGO_ROOT_USERNAME=$(printf '%q' "${MONGO_ROOT_USERNAME}")
          MONGO_ROOT_PASSWORD=$(printf '%q' "${MONGO_ROOT_PASSWORD}")
          MONGO_DATABASE=$(printf '%q' "${MONGO_DATABASE}")
          MONGO_COLLECTION_NAME=$(printf '%q' "${MONGO_COLLECTION_NAME}")

          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          export BACKEND_IMAGE
          export FRONTEND_IMAGE
          export CADDY_IMAGE
          export IMAGE_TAG
          export MONGO_ROOT_USERNAME
          export MONGO_ROOT_PASSWORD
          export MONGO_DATABASE
          export MONGO_COLLECTION_NAME

          echo "\${GHCR_TOKEN}" | docker login ghcr.io --username "\${GHCR_LOGIN_USERNAME}" --password-stdin

          docker compose -f "\${DEPLOY_PATH}/docker-compose.prod.yaml" pull mongo api frontend caddy
          docker compose -f "\${DEPLOY_PATH}/docker-compose.prod.yaml" up -d --remove-orphans mongo api frontend caddy

          for i in \$(seq 1 30); do
            status=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' demoobject-api 2>/dev/null || true)
            frontend_status=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' demoobject-frontend 2>/dev/null || true)
            if [ "\${status}" = "healthy" ] && [ "\${frontend_status}" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          echo "API and/or frontend container did not become healthy in time." >&2
          docker ps >&2
          docker logs --tail 100 demoobject-api >&2 || true
          docker logs --tail 100 demoobject-frontend >&2 || true
          exit 1
          EOF
          
      - name: Validate caddy and HTTPS reachability
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "${HOME}/.ssh/demoobject_deploy_key" -o StrictHostKeyChecking=yes "${VM_USER}@${VM_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail

          for i in $(seq 1 30); do
            caddy_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' demoobject-caddy 2>/dev/null || true)
            if [ "${caddy_status}" = "running" ] || [ "${caddy_status}" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          caddy_status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' demoobject-caddy 2>/dev/null || true)
          if [ "${caddy_status}" != "running" ] && [ "${caddy_status}" != "healthy" ]; then
            echo "Caddy container is not running." >&2
            docker ps >&2
            docker logs demoobject-caddy >&2 || true
            exit 1
          fi
          EOF

          http_headers=$(curl -I --connect-timeout 10 --retry 10 --retry-delay 3 http://demo.init.zhaw.ch 2>&1 || true)
          echo "$http_headers"
          if ! printf '%s\n' "$http_headers" | grep -Eq 'HTTP/[0-9.]+ 30[128]'; then
            echo "HTTP endpoint did not return a redirect." >&2
            exit 1
          fi
          if ! printf '%s\n' "$http_headers" | grep -qi '^location: https://demo\.init\.zhaw\.ch'; then
            echo "HTTP endpoint did not redirect to HTTPS." >&2
            exit 1
          fi

          https_headers=$(curl -I --connect-timeout 10 --retry 10 --retry-delay 3 https://demo.init.zhaw.ch 2>&1 || true)
          echo "$https_headers"
          if ! printf '%s\n' "$https_headers" | grep -Eq 'HTTP/[0-9.]+ 200|HTTP/[0-9.]+ 304'; then
            echo "HTTPS endpoint is not reachable successfully." >&2
            exit 1
          fi
