name: Delete Mongo Data

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-mongo-clean
  cancel-in-progress: true

jobs:
  drop-session-collection:
    name: Drop session collection
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || 'ubuntu' }}
      MONGO_DATABASE: ${{ vars.MONGO_DATABASE }}
      MONGO_COLLECTION_NAME: ${{ vars.MONGO_COLLECTION_NAME }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
    steps:
      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            VM_HOST
            VM_USER
            MONGO_DATABASE
            MONGO_COLLECTION_NAME
          )

          required_secrets=(
            SSH_PRIVATE_KEY
            MONGO_ROOT_USERNAME
            MONGO_ROOT_PASSWORD
          )

          for key in "${required_vars[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Variable: ${key}" >&2
              exit 1
            fi
          done

          for key in "${required_secrets[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Secret: ${key}" >&2
              exit 1
            fi
          done

      - name: Configure SSH access to VM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${HOME}/.ssh/demoobject_deploy_key"
          chmod 600 "${HOME}/.ssh/demoobject_deploy_key"
          ssh-keyscan -H "${VM_HOST}" >> "${HOME}/.ssh/known_hosts"
          chmod 644 "${HOME}/.ssh/known_hosts"

      - name: Validate Mongo container availability on VM
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "${HOME}/.ssh/demoobject_deploy_key" -o StrictHostKeyChecking=yes "${VM_USER}@${VM_HOST}" '
            set -euo pipefail
            docker ps --format "{{.Names}}" | grep -Fx "demoobject-mongo" >/dev/null
          '

      - name: Drop session collection
        shell: bash
        run: |
          set -euo pipefail

          ssh -i "${HOME}/.ssh/demoobject_deploy_key" -o StrictHostKeyChecking=yes "${VM_USER}@${VM_HOST}" 'bash -s' <<EOF
          set -euo pipefail
          MONGO_DATABASE=$(printf '%q' "${MONGO_DATABASE}")
          MONGO_COLLECTION_NAME=$(printf '%q' "${MONGO_COLLECTION_NAME}")
          MONGO_ROOT_USERNAME=$(printf '%q' "${MONGO_ROOT_USERNAME}")
          MONGO_ROOT_PASSWORD=$(printf '%q' "${MONGO_ROOT_PASSWORD}")

          docker exec \
            -e MONGO_COLLECTION_NAME="\${MONGO_COLLECTION_NAME}" \
            demoobject-mongo \
            mongosh \
            --quiet \
            --username "\${MONGO_ROOT_USERNAME}" \
            --password "\${MONGO_ROOT_PASSWORD}" \
            --authenticationDatabase admin \
            "\${MONGO_DATABASE}" \
            --eval 'db.getCollection(process.env.MONGO_COLLECTION_NAME).drop()'
          EOF
