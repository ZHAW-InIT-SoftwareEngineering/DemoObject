name: Demo Object - Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: true

jobs:
  build_and_push_backend:
    name: Build and Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE || 'ghcr.io/gabc/demoobject-backend' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          provenance: false
          sbom: false

  deploy_backend:
    name: Deploy Backend to VM
    runs-on: ubuntu-latest
    needs: build_and_push_backend
    environment: production
    permissions:
      contents: read
    env:
      VM_HOST: ${{ vars.VM_HOST }}
      VM_USER: ${{ vars.VM_USER || 'ubuntu' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/demoobject' }}
      BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE || 'ghcr.io/gabc/demoobject-backend' }}
      FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE || 'ghcr.io/gabc/demoobject-frontend' }}
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '80' }}
      MONGO_DATABASE: ${{ vars.MONGO_DATABASE }}
      SESSION_COLLECTION_NAME: ${{ vars.SESSION_COLLECTION_NAME }}
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            VM_HOST
            VM_USER
            DEPLOY_PATH
            BACKEND_IMAGE
            MONGO_DATABASE
            SESSION_COLLECTION_NAME
          )

          required_secrets=(
            MONGO_ROOT_USERNAME
            MONGO_ROOT_PASSWORD
          )

          for key in "${required_vars[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Variable: ${key}" >&2
              exit 1
            fi
          done

          for key in "${required_secrets[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Secret: ${key}" >&2
              exit 1
            fi
          done

          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "Missing required GitHub Secret: SSH_PRIVATE_KEY" >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/demoobject_deploy_key
          chmod 600 ~/.ssh/demoobject_deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload compose file to VM
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/demoobject_deploy_key "${VM_USER}@${VM_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          scp -i ~/.ssh/demoobject_deploy_key deploy/docker-compose.prod.yml "${VM_USER}@${VM_HOST}:${DEPLOY_PATH}/docker-compose.prod.yml"

      - name: Deploy mongo and api services
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          q() { printf '%q' "$1"; }

          remote_script=$(cat <<EOF
          set -euo pipefail

          export BACKEND_IMAGE=$(q "$BACKEND_IMAGE")
          export FRONTEND_IMAGE=$(q "$FRONTEND_IMAGE")
          export FRONTEND_PORT=$(q "$FRONTEND_PORT")
          export IMAGE_TAG=$(q "$IMAGE_TAG")
          export MONGO_ROOT_USERNAME=$(q "$MONGO_ROOT_USERNAME")
          export MONGO_ROOT_PASSWORD=$(q "$MONGO_ROOT_PASSWORD")
          export MONGO_DATABASE=$(q "$MONGO_DATABASE")
          export SESSION_COLLECTION_NAME=$(q "$SESSION_COLLECTION_NAME")

          docker compose -f $(q "$DEPLOY_PATH/docker-compose.prod.yml") pull mongo api
          docker compose -f $(q "$DEPLOY_PATH/docker-compose.prod.yml") up -d --remove-orphans mongo api

          for i in \$(seq 1 30); do
            status=\$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' demoobject-api 2>/dev/null || true)
            if [ "\$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          echo "API container did not become healthy in time." >&2
          docker ps >&2
          docker logs --tail 100 demoobject-api >&2 || true
          exit 1
          EOF
          )

          ssh -i ~/.ssh/demoobject_deploy_key "${VM_USER}@${VM_HOST}" "bash -se" <<<"${remote_script}"
