name: Demo Object - Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-backend-deploy
  cancel-in-progress: true

jobs:
  build_and_push_backend:
    name: Build and Push Backend Image
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      packages: write
    env:
      BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE || 'ghcr.io/gabc/demoobject-backend' }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate GHCR credentials are present
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.GHCR_PAT }}" ]; then
            echo "Missing required GitHub Secret: GHCR_PAT" >&2
            exit 1
          fi
          if [ -z "${GHCR_USERNAME}" ]; then
            echo "Missing required GitHub Variable: GHCR_USERNAME" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          provenance: false
          sbom: false

  deploy_backend:
    name: Deploy Backend to VM
    runs-on: [self-hosted, Linux, X64]
    needs: build_and_push_backend
    permissions:
      contents: read
    env:
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/demoobject' }}
      BACKEND_IMAGE: ${{ vars.BACKEND_IMAGE || 'ghcr.io/gabc/demoobject-backend' }}
      FRONTEND_IMAGE: ${{ vars.FRONTEND_IMAGE || 'ghcr.io/gabc/demoobject-frontend' }}
      FRONTEND_PORT: ${{ vars.FRONTEND_PORT || '80' }}
      GHCR_USERNAME: ${{ vars.GHCR_USERNAME || 'gabc' }}
      MONGO_DATABASE: ${{ vars.MONGO_DATABASE }}
      SESSION_COLLECTION_NAME: ${{ vars.SESSION_COLLECTION_NAME }}
      GHCR_PAT: ${{ secrets.GHCR_PAT }}
      MONGO_ROOT_USERNAME: ${{ secrets.MONGO_ROOT_USERNAME }}
      MONGO_ROOT_PASSWORD: ${{ secrets.MONGO_ROOT_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            DEPLOY_PATH
            BACKEND_IMAGE
            MONGO_DATABASE
            SESSION_COLLECTION_NAME
          )

          required_secrets=(
            GHCR_PAT
            MONGO_ROOT_USERNAME
            MONGO_ROOT_PASSWORD
          )

          for key in "${required_vars[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Variable: ${key}" >&2
              exit 1
            fi
          done

          for key in "${required_secrets[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub Secret: ${key}" >&2
              exit 1
            fi
          done

      - name: Validate Docker availability
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker compose version

      - name: Log in to GHCR for deploy pull
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Prepare compose file on host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${DEPLOY_PATH}"
          cp deploy/docker-compose.prod.yml "${DEPLOY_PATH}/docker-compose.prod.yml"

      - name: Deploy mongo and api services on self-hosted runner
        shell: bash
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          export BACKEND_IMAGE
          export FRONTEND_IMAGE
          export FRONTEND_PORT
          export IMAGE_TAG
          export MONGO_ROOT_USERNAME
          export MONGO_ROOT_PASSWORD
          export MONGO_DATABASE
          export SESSION_COLLECTION_NAME

          docker compose -f "${DEPLOY_PATH}/docker-compose.prod.yml" pull mongo api
          docker compose -f "${DEPLOY_PATH}/docker-compose.prod.yml" up -d --remove-orphans mongo api

          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' demoobject-api 2>/dev/null || true)
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done

          echo "API container did not become healthy in time." >&2
          docker ps >&2
          docker logs --tail 100 demoobject-api >&2 || true
          exit 1
