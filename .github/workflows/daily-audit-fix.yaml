name: Daily NPM Audit Fix

on:
  schedule:
    - cron: "00 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-npm-audit-fix
  cancel-in-progress: true

jobs:
  audit_fix:
    name: Run npm audit fix
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_FETCH_RETRIES: "5"
      NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
      NPM_CONFIG_FETCH_TIMEOUT: "300000"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Apply package-lock audit fixes in backend and frontend
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local max_attempts="$1"
            shift
            local attempt=1
            local delay=5

            until "$@"; do
              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Command failed after ${attempt} attempts: $*" >&2
                return 1
              fi

              echo "Command failed (attempt ${attempt}/${max_attempts}): $*" >&2
              echo "Retrying in ${delay}s..." >&2
              sleep "${delay}"

              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          audit_fix_or_skip_force() {
            local module="$1"
            local max_attempts=3
            local attempt=1
            local delay=5
            local audit_output

            while true; do
              if audit_output="$(npm audit fix --package-lock-only 2>&1)"; then
                printf '%s\n' "${audit_output}"
                return 0
              fi

              printf '%s\n' "${audit_output}"

              if grep -Fq 'npm audit fix --force' <<<"${audit_output}"; then
                echo "Skipping remaining audit fixes in ${module}: npm reports that only force fixes remain."
                echo "Manual maintainer review required for ${module}."
                return 0
              fi

              if [ "${attempt}" -ge "${max_attempts}" ]; then
                echo "Command failed after ${attempt} attempts: npm audit fix --package-lock-only" >&2
                return 1
              fi

              echo "Command failed (attempt ${attempt}/${max_attempts}): npm audit fix --package-lock-only" >&2
              echo "Retrying in ${delay}s..." >&2
              sleep "${delay}"

              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          apply_audit_fix() {
            local module="$1"
            local audit_dir
            audit_dir="$(mktemp -d)"

            cleanup() {
              rm -rf "${audit_dir}"
            }
            trap cleanup RETURN

            cp "${module}/package.json" "${module}/package-lock.json" "${audit_dir}/"

            (
              cd "${audit_dir}"
              retry 3 npm ci
              audit_fix_or_skip_force "${module}"
            )

            cp "${audit_dir}/package.json" "${module}/package.json"
            cp "${audit_dir}/package-lock.json" "${module}/package-lock.json"
          }

          for module in backend frontend; do
            echo "Running npm audit fix in ${module}"
            apply_audit_fix "${module}"
          done

      - name: Create or update pull request (attempt 1)
        id: cpr_attempt_1
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): daily npm audit fix"
          branch: "chore/daily-npm-audit-fix"
          delete-branch: true
          title: "chore(deps): daily npm audit fix"
          body: |
            Automated daily security maintenance.

            This PR was generated by `.github/workflows/daily-audit-fix.yaml` and runs:
            - `npm audit fix --package-lock-only` in `backend`
            - `npm audit fix --package-lock-only` in `frontend`
          labels: |
            dependencies
            security
          add-paths: |
            backend/package.json
            backend/package-lock.json
            frontend/package.json
            frontend/package-lock.json

      - name: Create or update pull request (attempt 2)
        id: cpr_attempt_2
        if: steps.cpr_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): daily npm audit fix"
          branch: "chore/daily-npm-audit-fix"
          delete-branch: true
          title: "chore(deps): daily npm audit fix"
          body: |
            Automated daily security maintenance.

            This PR was generated by `.github/workflows/daily-audit-fix.yaml` and runs:
            - `npm audit fix --package-lock-only` in `backend`
            - `npm audit fix --package-lock-only` in `frontend`
          labels: |
            dependencies
            security
          add-paths: |
            backend/package.json
            backend/package-lock.json
            frontend/package.json
            frontend/package-lock.json

      - name: Create or update pull request (attempt 3)
        id: cpr_attempt_3
        if: steps.cpr_attempt_1.outcome == 'failure' && steps.cpr_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): daily npm audit fix"
          branch: "chore/daily-npm-audit-fix"
          delete-branch: true
          title: "chore(deps): daily npm audit fix"
          body: |
            Automated daily security maintenance.

            This PR was generated by `.github/workflows/daily-audit-fix.yaml` and runs:
            - `npm audit fix --package-lock-only` in `backend`
            - `npm audit fix --package-lock-only` in `frontend`
          labels: |
            dependencies
            security
          add-paths: |
            backend/package.json
            backend/package-lock.json
            frontend/package.json
            frontend/package-lock.json

      - name: Fail if PR creation failed after retries
        if: steps.cpr_attempt_1.outcome == 'failure' && steps.cpr_attempt_2.outcome == 'failure' && steps.cpr_attempt_3.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          echo "create-pull-request failed after 3 attempts." >&2
          exit 1
