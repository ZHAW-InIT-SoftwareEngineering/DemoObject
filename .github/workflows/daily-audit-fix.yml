name: Daily NPM Audit Fix

on:
  schedule:
    - cron: "00 1 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-npm-audit-fix
  cancel-in-progress: true

jobs:
  audit_fix:
    name: Run npm audit fix
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Apply audit fixes in backend and frontend
        shell: bash
        run: |
          set -euo pipefail
          for module in backend frontend; do
            echo "Running npm audit fix in ${module}"
            (
              cd "${module}"
              npm ci
              npm audit fix
            )
          done

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(deps): daily npm audit fix"
          branch: "chore/daily-npm-audit-fix"
          delete-branch: true
          title: "chore(deps): daily npm audit fix"
          body: |
            Automated daily security maintenance.

            This PR was generated by `.github/workflows/daily-audit-fix.yml` and runs:
            - `npm audit fix` in `backend`
            - `npm audit fix` in `frontend`
          labels: |
            dependencies
            security
          add-paths: |
            backend/package.json
            backend/package-lock.json
            frontend/package.json
            frontend/package-lock.json
