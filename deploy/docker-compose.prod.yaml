services:
  mongo:
    image: mongo:7
    container_name: demoobject-mongo
    restart: unless-stopped
    command: ["--bind_ip_all", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    container_name: demoobject-api
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_CONN_STRING: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE}?authSource=admin
      DB_NAME: ${MONGO_DATABASE}
      SESSION_COLLECTION_NAME: ${SESSION_COLLECTION_NAME}
    expose:
      - "3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    image: ${FRONTEND_IMAGE}:${IMAGE_TAG}
    container_name: demoobject-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - "${TLS_CERTS_DIR:-./certs}:/etc/nginx/certs:ro"
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_TLS_PORT:-443}:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
